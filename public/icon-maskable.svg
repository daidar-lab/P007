<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Comunicado de Intervenção">
  <!-- Versão "maskable": fundo sólido preenchendo 100%, conteúdo dentro da safe zone (~80% central).
       O sistema Android aplica seu próprio recorte (círculo, squircle, teardrop, etc.). -->
  <rect width="512" height="512" fill="#272525"/>

  <!-- Cruz centralizada e um pouco menor, confortavelmente dentro da safe zone -->
  <g fill="#26A269">
    <rect x="224" y="132" width="64"  height="248" rx="14"/>
    <rect x="132" y="224" width="248" height="64"  rx="14"/>
  </g>
</svg>
